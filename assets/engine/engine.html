<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #101828; overflow: hidden; }
  svg { display: block; }
  text { font-family: "Yuanti SC", "PingFang SC", "Hiragino Sans GB", "Heiti SC", sans-serif; }
</style>
</head>
<body>
<svg id="stage" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gSkyDay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FD4F0"/><stop offset="55%" stop-color="#C6EBF7"/><stop offset="100%" stop-color="#F3F8D9"/>
    </linearGradient>
    <linearGradient id="gSkyNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13203B"/><stop offset="45%" stop-color="#1F3C66"/><stop offset="100%" stop-color="#35618C"/>
    </linearGradient>
    <linearGradient id="gUnder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5FC6D8"/><stop offset="50%" stop-color="#2A87B8"/><stop offset="100%" stop-color="#0E3F68"/>
    </linearGradient>
    <linearGradient id="gForest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E6B3F"/><stop offset="60%" stop-color="#43834B"/><stop offset="100%" stop-color="#8CBF5A"/>
    </linearGradient>
    <linearGradient id="gSkyHigh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E7FC4"/><stop offset="60%" stop-color="#7FB9E4"/><stop offset="100%" stop-color="#D8EEF9"/>
    </linearGradient>
    <linearGradient id="gRoom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6E3C4"/><stop offset="100%" stop-color="#E3C79E"/>
    </linearGradient>
    <linearGradient id="gStorm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101724"/><stop offset="55%" stop-color="#26313F"/><stop offset="100%" stop-color="#41505F"/>
    </linearGradient>
    <linearGradient id="gMicro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131A2E"/><stop offset="100%" stop-color="#243A56"/>
    </linearGradient>
    <radialGradient id="gGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF6C0"/><stop offset="40%" stop-color="#FFC93C" stop-opacity="0.62"/><stop offset="100%" stop-color="#FFB300" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9D6"/><stop offset="55%" stop-color="#FFE98A"/><stop offset="100%" stop-color="#FFD34D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gLamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF4C8" stop-opacity="0.95"/><stop offset="60%" stop-color="#FFD97A" stop-opacity="0.35"/><stop offset="100%" stop-color="#FFC94D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gVig" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#281C0C" stop-opacity="0"/><stop offset="24%" stop-color="#281C0C" stop-opacity="0"/>
      <stop offset="100%" stop-color="#281C0C" stop-opacity="0.30"/>
    </radialGradient>
    <pattern id="pGrass" width="200" height="140" patternUnits="userSpaceOnUse">
      <g stroke="#7FBF3C" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5">
        <path d="M30 110 q8 -30 1 -46"/><path d="M42 110 q-9 -26 -3 -40"/>
        <path d="M142 70 q8 -26 2 -40"/><path d="M154 70 q-8 -22 -2 -34"/>
        <path d="M96 132 q7 -24 1 -38"/><path d="M108 132 q-8 -20 -2 -32"/>
      </g>
    </pattern>
    <pattern id="pGrid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0 H0 V120" fill="none" stroke="#5E86B8" stroke-width="1.5" opacity="0.22"/>
    </pattern>
    <clipPath id="frameClip"><rect x="0" y="0" width="1920" height="1080"/></clipPath>

    <!-- 角色高光：把 SourceAlpha 模糊后当高度场，用点光源打镜面反射，
         色块边缘就有一圈高光，平涂立刻变成"塑料/搪胶"质感。
         只作用于角色，不要套到整屏（整屏做这个会慢十倍）。 -->
    <filter id="fCandy" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="b"/>
      <feSpecularLighting in="b" surfaceScale="3.5" specularConstant="0.85"
                          specularExponent="16" lighting-color="#FFFDF5" result="s">
        <fePointLight x="110" y="-240" z="300"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
      <feComposite in="SourceGraphic" in2="s2" operator="arithmetic"
                   k1="0" k2="1" k3="0.62" k4="0"/>
    </filter>

    <!-- 接地阴影：用径向渐变假装高斯模糊。真上 feGaussianBlur 逐帧渲染会慢一个数量级 -->
    <radialGradient id="gShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2A1B10" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#2A1B10" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#2A1B10" stop-opacity="0"/>
    </radialGradient>
    <!-- 氛围光斑：中间亮、边缘化开 -->
    <radialGradient id="gBokeh" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 卡片/圆盘投影：偏移一点，边缘柔 -->
    <radialGradient id="gDrop" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1A1208" stop-opacity="0.22"/>
      <stop offset="0.7" stop-color="#1A1208" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#1A1208" stop-opacity="0"/>
    </radialGradient>
    <!-- 主光光晕：从左上打下来。有它画面立刻"有光源"，不再是均匀亮度 -->
    <radialGradient id="gKeyLight" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF8E4" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#FFF3D2" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFF3D2" stop-opacity="0"/>
    </radialGradient>
    <!-- 地面薄雾：远景和地面之间垫一层空气 -->
    <linearGradient id="gHaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.34"/>
    </linearGradient>
  </defs>

  <!-- 色彩分级不在这里做：CSS filter 会让每帧重新合成整层，实测渲染慢近一倍。
       改到 build.py 的 ffmpeg 编码阶段（eq=saturation:contrast），零渲染成本。 -->
  <g id="world" clip-path="url(#frameClip)"></g>

  <!-- 氛围层：光斑 + 浮尘。在镜头里、后期之前，所以会被暗角一起压住 -->
  <g id="atmo" clip-path="url(#frameClip)"></g>

  <!-- 电影感后期：强度按背景亮度自动分档 -->
  <g id="post">
    <rect id="postGrade" width="1920" height="1080" fill="#8A5A2A" opacity="0.05" style="mix-blend-mode:overlay"/>
    <rect id="postVig" width="1920" height="1080" fill="url(#gVig)"/>
  </g>

  <!-- 字幕：两条，按句切分逐条上屏 -->
  <g id="subLayer">
    <!-- 两行时底对齐：基线 946 / 1006，第二行底部约 1022，离画面下沿还有 58px。
         原来是 958 / 1026，第二行几乎贴着底边，看着像被切了一半 -->
    <text id="sub0" x="960" y="946" font-size="48" font-weight="600" text-anchor="middle"
          fill="#FFFFFF" stroke="#2A1B10" stroke-width="12" stroke-linejoin="round"
          paint-order="stroke fill" opacity="0"> </text>
    <text id="sub1" x="960" y="1006" font-size="48" font-weight="600" text-anchor="middle"
          fill="#FFFFFF" stroke="#2A1B10" stroke-width="12" stroke-linejoin="round"
          paint-order="stroke fill" opacity="0"> </text>
  </g>
</svg>

<script src="rough.js"></script>
<script src="chars.js"></script>
<script>
/* ==================================================================
   考考&小熹 · 通用渲染引擎
   一条时间线 = N 个片段（segment），每段是一个「场景类型 × 背景」的组合。
   window.setTimeline(tl) 挂载，window.renderFrame(t) 逐帧求值。
   所有随机量走确定性哈希，同一 t 永远同一画面。
================================================================== */
const NS = "http://www.w3.org/2000/svg";
/* 画布尺寸默认 16:9。封面另有一版 4:3（B 站），由 cover.py 在挂载前调 setCanvas 改。
   注意：改 W/H 只对「按 W/H 现算」的场景安全，所以 4:3 只跑专用的 cover43 场景。 */
let W = 1920, H = 1080;
window.setCanvas = (w, h) => {
  W = w; H = h;
  const st = document.getElementById("stage");
  if (st) {
    st.setAttribute("width", w); st.setAttribute("height", h);
    st.setAttribute("viewBox", `0 0 ${w} ${h}`);
  }
};

/* ---------------- 手绘后端（Rough.js） ----------------
   同一个 el() 出口，所有图元自动换成抖动版。
   三条硬规则（踩过坑，见 references/pitfalls.md）：
   · 填色层精确、描边层手绘 —— 一次调用同时给 fill+stroke 会露底
   · 大形态必须把 roughness 压到 2 以内，否则整条曲线往里缩、露出内轮廓
   · 渐变填充不参与手绘（嵌套 <g> 会改渐变坐标系）
*/
const ROUGH = new URLSearchParams(location.search).get("style") === "rough";
const RQ = parseFloat(new URLSearchParams(location.search).get("rq") || "6");
const ROUGH_SHAPES = new Set(["path", "rect", "circle", "ellipse", "polygon", "line"]);
const ROUGH_MOVE = ["id", "transform", "transform-origin", "opacity", "display", "class", "style", "clip-path", "filter"];
let RC = null, SEED = 0, ROUGHING = false;

/* 手绘档的随机种子。默认写死，保证同一台机器、同一次构建、每一帧的抖动完全一致
   —— 否则线条会"烧开水"。要换抖动形态改 ?seed=xxx 即可。 */
const ROUGH_SEED = parseInt(new URLSearchParams(location.search).get("seed") || "20261116", 10);

function shapeSpec(node) {
  const tag = node.tagName.toLowerCase();
  const n = (a, d = 0) => { const v = node.getAttribute(a); return v == null || v === "" ? d : parseFloat(v); };
  if (tag === "path") { const d = node.getAttribute("d") || ""; return d.length > 8 ? { kind: "path", d } : null; }
  if (tag === "rect") {
    const x = n("x"), y = n("y"), w = n("width"), h = n("height");
    if (!(w > 0 && h > 0)) return null;
    const r = Math.min(n("rx") || n("ry"), w / 2, h / 2);
    if (!(r > 0)) return { kind: "rect", x, y, w, h };
    const pts = [];
    for (const [cx, cy, a0] of [[x + w - r, y + r, -90], [x + w - r, y + h - r, 0],
                               [x + r, y + h - r, 90], [x + r, y + r, 180]]) {
      for (let i = 0; i <= 4; i++) {
        const a = (a0 + i * 22.5) * Math.PI / 180;
        pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
      }
    }
    return { kind: "polygon", pts, round: true };
  }
  if (tag === "circle") { const r = n("r"); return r > 0 ? { kind: "circle", x: n("cx"), y: n("cy"), w: r * 2, h: r * 2 } : null; }
  if (tag === "ellipse") {
    const rx = n("rx"), ry = n("ry");
    return rx > 0 && ry > 0 ? { kind: "ellipse", x: n("cx"), y: n("cy"), w: rx * 2, h: ry * 2 } : null;
  }
  if (tag === "line") return { kind: "line", x1: n("x1"), y1: n("y1"), x2: n("x2"), y2: n("y2") };
  if (tag === "polygon") {
    const arr = (node.getAttribute("points") || "").trim().split(/[\s,]+/).map(Number);
    if (arr.length < 6) return null;
    const p = [];
    for (let i = 0; i + 1 < arr.length; i += 2) p.push([arr[i], arr[i + 1]]);
    return { kind: "polygon", pts: p };
  }
  return null;
}

function roughPrim(spec, o) {
  switch (spec.kind) {
    case "path": return RC.path(spec.d, o);
    case "rect": return RC.rectangle(spec.x, spec.y, spec.w, spec.h, o);
    case "circle": return RC.circle(spec.x, spec.y, spec.w, o);
    case "ellipse": return RC.ellipse(spec.x, spec.y, spec.w, spec.h, o);
    case "line": return RC.line(spec.x1, spec.y1, spec.x2, spec.y2, o);
    case "polygon": return RC.polygon(spec.pts, o);
  }
  return null;
}

function roughNode(node) {
  if (!RC) RC = rough.svg(document.getElementById("stage"));
  const rawFill = node.getAttribute("fill") || "none";
  const rawStroke = node.getAttribute("stroke") || "none";
  if (rawFill.includes("url(") || rawStroke.includes("url(")) return null;
  const spec = shapeSpec(node);
  if (!spec) return null;
  const fill = node.getAttribute("fill") || "none";
  const stroke = node.getAttribute("stroke") || "none";
  const sw = parseFloat(node.getAttribute("stroke-width") || "0");
  const hasF = fill !== "none", hasS = stroke !== "none" && sw > 0;
  const seed = 400 + (SEED++ * 37) % 997;
  let span = 999, thin = 999;
  try { const bb = node.getBBox(); span = Math.max(bb.width, bb.height); thin = Math.min(bb.width, bb.height); } catch (e) {}
  const k = span < 90 ? 0.3 : span < 190 ? 0.6 : 1;
  const kt = thin < 80 ? 0.25 : thin < 130 ? 0.45 : 1;

  const g = document.createElementNS(NS, "g");
  if (hasF) {
    const bigFill = span > 300 && !hasS;
    const fr = bigFill ? Math.min(RQ * 0.55, 6) : 0;
    const fg = roughPrim(spec, { fill, fillStyle: "solid", stroke: "none", roughness: fr, bowing: fr * 0.9, seed });
    if (fg) { for (const p of [...fg.children]) p.setAttribute("stroke", "none"); g.appendChild(fg); }
  }
  if (hasS) {
    const isRound = !!spec.round;
    const bigCap = span > 150 ? Math.min(2.2, 900 / span) : 99;
    const rgn = Math.min(RQ * k * kt, sw * 0.62, span * 0.05, isRound ? 3 : 99, bigCap);
    const dash = (node.getAttribute("stroke-dasharray") || "").trim().split(/[\s,]+/).filter(Boolean).map(Number);
    const sg = roughPrim(spec, {
      fill: "none", stroke, strokeWidth: sw, roughness: rgn, bowing: isRound ? 0.8 : rgn * 0.5, seed: seed + 1,
      disableMultiStroke: true, preserveVertices: true, curveStepCount: 12,
      ...(dash.length ? { strokeLineDash: dash } : {}),
    });
    if (sg) g.appendChild(sg);
  }
  return g.children.length ? g : null;
}

function wrapRough(node) {
  const shape = roughNode(node);
  if (!shape) return node;
  const g = document.createElementNS(NS, "g");
  for (const a of ROUGH_MOVE) if (node.hasAttribute(a)) g.setAttribute(a, node.getAttribute(a));
  g.setAttribute("data-rough", "1");
  g.appendChild(shape);
  if (node.parentNode) node.parentNode.replaceChild(g, node);
  return g;
}

/* ---------------- 图元工厂 ---------------- */
function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  const crispTree = parent && parent.closest && parent.closest("[data-crisp-tree]");
  if (ROUGHING && ROUGH_SHAPES.has(tag) && !crispTree && !("data-crisp" in attrs)) return wrapRough(n);
  return n;
}

function txt(parent, str, x, y, size, fill, weight, anchor, ls) {
  const t = el("text", { x, y, "font-size": size, fill, "font-weight": weight || 600,
                         "text-anchor": anchor || "middle", "letter-spacing": ls == null ? 2 : ls }, parent);
  t.textContent = str;
  return t;
}

/* 中文按字数折行（SVG text 不会自动换行） */
function wrapTxt(parent, str, x, y, size, fill, weight, maxChars, lh, anchor) {
  const lines = [];
  const raw = String(str).split("\n");
  for (const r of raw) {
    if (r.length <= maxChars) { lines.push(r); continue; }
    // 带空格的文字（西语等）必须按词断，不能按字符硬切——
    // 硬切会把 "más" 切成 "m / ás"，看起来像乱码
    if (r.includes(" ")) {
      let buf2 = "";
      for (const w of r.split(/\s+/)) {
        if (!buf2) { buf2 = w; }
        else if ((buf2 + " " + w).length <= maxChars) { buf2 += " " + w; }
        else { lines.push(buf2); buf2 = w; }
      }
      if (buf2) lines.push(buf2);
      continue;
    }
    // 中文：优先在标点处断
    let buf = "";
    for (const ch of r) {
      buf += ch;
      if (buf.length >= maxChars && "，。！？；：、".includes(ch)) { lines.push(buf); buf = ""; }
      else if (buf.length >= maxChars + 1) { lines.push(buf); buf = ""; }
    }
    if (buf) lines.push(buf);
  }
  const out = [];
  lines.forEach((s, i) => {
    const t = txt(parent, s, x, y + i * lh, size, fill, weight, anchor || "middle", 2);
    out.push(t);
  });
  return out;
}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const easeOut = u => 1 - Math.pow(1 - clamp(u, 0, 1), 3);
// 电影感动效靠「快起慢收」：前 20% 走完 60% 距离，剩下慢慢贴住。
// Expo 比 cubic 收得更狠，是 motion graphics 里最常用的那档。
const easeOutExpo = u => { u = clamp(u, 0, 1); return u >= 1 ? 1 : 1 - Math.pow(2, -10 * u); };
const easeOutQuint = u => 1 - Math.pow(1 - clamp(u, 0, 1), 5);
const easeInOut = u => { u = clamp(u, 0, 1); return u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
const easeBack = u => { u = clamp(u, 0, 1); const c = 1.70158; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
function rnd(seed) { const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

/* ---------- 镜头：每段自带一点推拉 + 漂移 ----------
   静止画面显「平」，加 3–5% 的缓慢缩放就能让观众感觉"镜头在呼吸"。
   幅度必须小：超过 8% 会看出元素在飘。drift 是正弦平移，单位 px。 */
// 注意 from/to 最小只能到 1.03：再小就跟 drift 的平移打架，画面边缘会露出画布外的空白
const CAMERA = {
  title: { from: 1.075, to: 1.030, drift: 9 },
  talk:  { from: 1.030, to: 1.058, drift: 6 },
  show:  { from: 1.030, to: 1.075, drift: 5 },
  card:  { from: 1.055, to: 1.030, drift: 4 },
  quiz:  { from: 1.030, to: 1.052, drift: 4 },
  outro: { from: 1.060, to: 1.030, drift: 8 },
};

/* ---------- 氛围：光斑 + 浮尘 ----------
   纯代码的「空气感」。用径向渐变当模糊，不上 feGaussianBlur。
   浅色背景要压很低，否则像雾霾；深色背景可以放开，那是光。 */
// 夜间给低值：meadow_night 背景自带萤火虫，再叠光斑就成泡泡了
const ATMO_OP = { meadow_day: 0.08, sky: 0.06, forest: 0.14, underwater: 0.20,
                  room: 0.10, room_storm: 0.18, storm: 0.24, meadow_night: 0.15, micro: 0.20 };
// 主光：暗场景要更强（月光/闪电是唯一光源），室内最弱（有台灯就够了）
const KEY_OP = { meadow_day: 0.55, sky: 0.50, forest: 0.75, underwater: 0.50,
                 room: 0.40, room_storm: 0.48, storm: 0.75, meadow_night: 0.80, micro: 0.60 };
// 薄雾：室内没有；深色场景压很低，否则一层灰
const HAZE_OP = { meadow_day: 0.50, sky: 0.25, forest: 0.45, underwater: 0.55,
                  room: 0, room_storm: 0, storm: 0.18, meadow_night: 0.22, micro: 0.20 };
const ATMO = { bokeh: [], dust: [], node: null, bg: null };

const INK = "#3A2A1C", CREAM = "#FDF4E2";

/* ==================================================================
   场景注册表 BG：每个函数在 root 里铺满一层，返回 update(t)
   prof: 后期档位 {grade, vig} —— 亮场景降档，避免压暗后发脏

   注意：这里内置的几个只是「兼容旧集的兜底」，不是背景库。
   新的一集请在该集 scenery.js 里用 SCENE_KIT.scene(name, fn) 按话题现画。
================================================================== */
const BG = {};

/* ---------------------------------------------------------------
   前景剪影：压在画面最前面，制造"镜头在草丛里"的纵深。
   规则：
   - 颜色要比中景暗 2–3 档，才会被读成"离镜头更近"；
   - 只放画面两侧 + 底部矮的一圈，中间留空给角色（角色脚底 950–1020）；
   - 尺寸大、细节少 —— 近景本来就该虚。
   --------------------------------------------------------------- */
function nearSil(g, kind, color, op) {
  const grp = el("g", { opacity: op == null ? 1 : op }, g);
  // 叶尖留一点宽度（收成一个窄边而不是一个点），否则整丛看起来像仙人掌
  const blade = (x, h, lean, w, c) => {
    const tipX = x + lean, tipY = 1090 - h, tw = Math.max(2.5, w * 0.14);
    return el("path", {
      d: `M ${x} 1090 ` +
         `C ${x - w * 0.45} ${1090 - h * 0.38} ${tipX - w * 0.5} ${1090 - h * 0.78} ${tipX - tw} ${tipY} ` +
         `L ${tipX + tw} ${tipY} ` +
         `C ${tipX + w * 0.45} ${1090 - h * 0.74} ${x + w * 1.15} ${1090 - h * 0.34} ${x + w} 1090 Z`,
      fill: c || color,
    }, grp);
  };

  if (kind === "grass") {
    // 两侧高草：22 片、更宽，才像"一丛草"而不是几根尖刺
    for (let i = 0; i < 22; i++) {
      const x = -50 + rnd(i * 3.7) * 400;
      blade(x, 140 + rnd(i * 7.1) * 250, (rnd(i * 2.3) - 0.5) * 140, 22 + rnd(i * 5.9) * 34);
    }
    for (let i = 0; i < 22; i++) {
      const x = 1540 + rnd(i * 4.1) * 430;
      blade(x, 140 + rnd(i * 6.7) * 250, (rnd(i * 2.9) - 0.5) * 140, 22 + rnd(i * 5.3) * 34);
    }
    // 底部矮草：高度压在 70 以内，不挡角色脚
    for (let i = 0; i < 14; i++) {
      const x = 240 + rnd(i * 5.1) * 1440;
      blade(x, 34 + rnd(i * 3.3) * 36, (rnd(i * 8.7) - 0.5) * 46, 10 + rnd(i * 2.1) * 12);
    }
    // 两块石头压角
    [[128, 1030, 96, 54], [1792, 1046, 118, 62]].forEach(([cx, cy, rx, ry], i) => {
      el("ellipse", { cx, cy, rx, ry, fill: color, opacity: 0.95 }, grp);
      el("ellipse", { cx: cx - rx * 0.28, cy: cy - ry * 0.3, rx: rx * 0.45, ry: ry * 0.4,
                      fill: "#FFFFFF", opacity: 0.10 + i * 0.02 }, grp);
    });
  } else if (kind === "branch") {
    // 上角伸进来的树枝
    el("path", { d: `M -60 -40 C 120 40 210 150 250 300 C 200 250 140 200 60 170 ` +
                     `C 10 150 -30 120 -60 140 Z`, fill: color }, grp);
    for (let i = 0; i < 12; i++) {
      const x = 20 + rnd(i * 4.3) * 240, y = 60 + rnd(i * 6.1) * 260;
      const s = 0.6 + rnd(i * 2.7) * 0.8;
      el("ellipse", { cx: x, cy: y, rx: 34 * s, ry: 15 * s,
                      transform: `rotate(${-40 + rnd(i * 3.9) * 60} ${x} ${y})`,
                      fill: color }, grp);
    }
  } else if (kind === "kelp") {
    for (let i = 0; i < 12; i++) {
      const x = (i < 6 ? -30 + rnd(i * 3.1) * 340 : 1600 + rnd(i * 4.7) * 380);
      const h = 220 + rnd(i * 5.3) * 300, w = 22 + rnd(i * 2.9) * 26;
      el("path", {
        d: `M ${x} 1090 C ${x - w} ${1090 - h * 0.6} ${x + w * 0.6} ${1090 - h * 0.85} ${x + w * 0.2} ${1090 - h} ` +
           `C ${x + w * 1.6} ${1090 - h * 0.7} ${x + w * 1.1} ${1090 - h * 0.35} ${x + w} 1090 Z`,
        fill: color }, grp);
    }
  } else if (kind === "coral") {
    for (let i = 0; i < 9; i++) {
      const x = rnd(i * 3.3) * W;
      const h = 70 + rnd(i * 5.7) * 150;
      el("path", { d: `M ${x} 1090 q -10 ${-h * 0.5} 6 ${-h} q 16 ${h * 0.5} 6 ${h} Z`,
                   fill: color }, grp);
    }
  }
  return grp;
}

  const wrap = el("g", {}, host);
  const KS = o.kaoScale || 0.92, XS = o.xiScale || 1.34;
  const kx = o.kaoX || 560, xx = o.xiX || 1320, feet = o.feet || 1010;

  // 接地阴影分两层：接触阴影紧贴脚底（深、小）+ 环境阴影铺开（淡、大）。
  // 只铺一层的话，深色地面上看不见、浅色地面上又像块脏斑。
  // data-crisp：阴影不该被 Rough.js 抖成毛边
  const sh = el("g", { "data-crisp": "1" }, wrap);
  [[kx, KS, 30], [xx, XS * 0.66, 26]].forEach(([cx0, wk, ry0]) => {
    el("ellipse", { cx: cx0, cy: feet - 4, rx: 74 * wk, ry: ry0 * wk,
                    fill: "#000000", opacity: 0.20 }, sh);
    el("ellipse", { cx: cx0, cy: feet + 8, rx: 150 * wk, ry: 34 * wk,
                    fill: "url(#gShadow)" }, sh);
  });

  const kaoG = el("g", {}, wrap);
  const xiG = el("g", {}, wrap);
  // 传 parent 进去：图元一创建就连在 DOM 上，Rough.js 才能量到真实尺寸
  const kao = buildKao(el, o.kaoExpr || "idle", kaoG);
  const xi = buildXi(el, {
    view: o.xiView || "front",
    expr: o.xiExpr || "idle",
    tail: o.xiTail || "still",
  }, xiG);
  return { wrap, kaoG, xiG, kao, xi, KS, XS, kx, xx, feet, sh };
}

function animMouth(node, anchor, on, tt, rate) {
  const k = on ? 0.42 + 0.62 * Math.abs(Math.sin(tt * (rate || 13)) * Math.sin(tt * 7.1 + 1.1)) : 1;
  node.setAttribute("transform", `translate(0 ${anchor}) scale(1 ${k}) translate(0 ${-anchor})`);
}

function blink(node, tt, seed) {
  const cycle = 2.6 + (seed % 7) * 0.31;
  const ph = tt % cycle;
  const k = ph < 0.11 ? 0.1 : 1;
  node.setAttribute("transform", `translate(0 -450) scale(1 ${k}) translate(0 450)`);
}

/* ---------- title：片头 / 封面 ----------
   片头这一帧同时是封面，所以构图按封面来：
     · 标题靠左上，字号大到缩略图也认得出
     · 本集讲的那个东西（cover）放在右侧当主体
     · 四周留 96px 安全边距，平台裁切也不会切到字
   给了 cover 就用这套；没给退回旧居中版（会报警，提示补封面）。
------------------------------------------------------------------------- */
SCENES.title = {
  mount(host, seg) {
    const coverFn = seg.cover ? FIGURES[seg.cover] : null;
    if (coverFn) {
      const hero = el("g", {}, host);
      const upd = coverFn(hero, seg);
      const s = seg.coverScale || 1;
      const dx = seg.coverX || 0, dy = seg.coverY || 0;
      // 围绕画面中心缩放，再整体平移，方便把主体挪到右半边
      hero.setAttribute("transform",
        `translate(${dx} ${dy}) translate(960 540) scale(${s}) translate(-960 -540)`);

      const M = 104;                       // 安全边距
      const brand = el("g", {}, host);
      const b = txt(brand, seg.brand || "kaokao&xiaoxi", M, 118, 44, INK, 800, "start");
      b.setAttribute("stroke", CREAM); b.setAttribute("stroke-width", 11);
      b.setAttribute("stroke-linejoin", "round"); b.setAttribute("paint-order", "stroke fill");
      el("path", { d: `M ${M} 148 H ${M + 300}`, stroke: CREAM, "stroke-width": 9, "stroke-linecap": "round" }, brand);
      el("path", { d: `M ${M} 148 H ${M + 300}`, stroke: INK, "stroke-width": 3, opacity: 0.45 }, brand);

      // 标题：封面上的字要人调，不让它自动断行——自动断行经常甩出一个孤零零的「？」
      // titleLines 给了就按行摆；没给就单行，字号按字数压。字号随最长行自适应，保证不缩到看不清。
      const lines = (seg.titleLines && seg.titleLines.length)
        ? seg.titleLines.slice(0, 2)
        : [seg.title || ""];
      const longest = Math.max(1, ...lines.map(l => l.length));
      const fs = Math.max(56, Math.min(84, Math.floor(760 / longest)));
      const head = el("g", {}, host);
      lines.forEach((ln, i) => {
        const t = txt(head, ln, M, 330 + i * fs * 1.16, fs, INK, 800, "start");
        t.setAttribute("stroke", CREAM); t.setAttribute("stroke-width", Math.round(fs * 0.17));
        t.setAttribute("stroke-linejoin", "round"); t.setAttribute("paint-order", "stroke fill");
      });
      // 副标：和标题重复就不画（封面寸土寸金）
      const kick = (seg.kicker || "").trim();
      const redundant = !kick || kick === seg.title || seg.title.includes(kick);
      if (!redundant) {
        const ky = 330 + (lines.length - 1) * fs * 1.16 + 76;
        const k = txt(head, kick, M, ky, 46, "#B4551F", 800, "start");
        k.setAttribute("stroke", CREAM); k.setAttribute("stroke-width", 12);
        k.setAttribute("paint-order", "stroke fill");
      }
      /* 封面必须有考考和小熹：小朋友靠这两个角色认频道。
         站位在左下，脚落到画面外只露上半身，抬头看右上主体，不压标题也不挡主体。 */
      const c = seg.chars === false ? null : castChars(host, {
        kaoX: seg.kaoX || 400, xiX: seg.xiX || 1470, feet: seg.feet || 1102,
        kaoScale: seg.kaoScale || 0.86, xiScale: seg.xiScale || 1.56,
        kaoExpr: seg.kaoExpr || "wow",
        xiView: seg.xiView || "front", xiExpr: seg.xiExpr || "happy", xiTail: seg.xiTail || "wag",
      });
      return (tt, u) => {
        const k = easeOut(clamp(u / 0.12, 0, 1));
        hero.setAttribute("opacity", k);
        hero.setAttribute("transform",
          `translate(${dx} ${dy + lerp(18, 0, k)}) translate(960 540) scale(${s}) translate(-960 -540)`);
        if (upd) upd(tt, u);
        head.setAttribute("opacity", easeOut(clamp((u - 0.04) / 0.12, 0, 1)));
        head.setAttribute("transform", `translate(0 ${lerp(26, 0, easeOut(clamp((u - 0.04) / 0.14, 0, 1)))})`);
        brand.setAttribute("opacity", easeOut(clamp(u / 0.12, 0, 1)));
        if (c) {
          // 从画面下沿升起来，比直接淡入更像「出场」
          const rise = lerp(70, 0, easeOut(clamp(u / 0.26, 0, 1)));
          const bob = Math.sin(tt * 2.0) * 6;
          c.kaoG.setAttribute("transform",
            `translate(${c.kx} ${c.feet + rise}) scale(${c.KS})`);
          c.xiG.setAttribute("transform",
            `translate(${c.xx} ${c.feet + rise + bob}) scale(${c.XS})`);
          if (c.xi.__mouth) animMouth(c.xi.__mouth, -125, false, tt, 15);
          if (c.kao.__eyes) blink(c.kao.__eyes, tt, 3);
        }
      };
    }

    // feet 同样留余量：片头镜头从 1.075 收到 1.03
    // 角色退到下方两侧，中间留给标题——不然标题一居中就压在头上
    const c = castChars(host, { kaoX: 340, xiX: 1420, feet: 1012, kaoScale: 0.9, xiScale: 1.3, kaoExpr: "idle" });

    // 品牌退到左上角当台标，标题占据画面中心。
    // 原来品牌压在中间的大蓝卡上、标题被挤到右边，观众第一眼不知道这集讲什么
    const brand = el("g", {}, host);
    const b = txt(brand, seg.brand || "kaokao&xiaoxi", 138, 112, 50, INK, 800, "start");
    b.setAttribute("stroke", CREAM);
    b.setAttribute("stroke-width", 11);
    b.setAttribute("stroke-linejoin", "round");
    b.setAttribute("paint-order", "stroke fill");
    el("path", { d: "M 138 142 H 470", stroke: CREAM, "stroke-width": 9, "stroke-linecap": "round" }, brand);
    el("path", { d: "M 138 142 H 470", stroke: INK, "stroke-width": 3, opacity: 0.45 }, brand);

    const head = el("g", {}, host);
    // 西语单词长，每行要放宽到 14 字符，否则会被切成三行
    const mc = seg.lang === "es" ? 14 : 10;
    const q = wrapTxt(head, seg.title || "", 960, 400, 92, INK, 800, mc, 118, "middle");
    q.forEach(t => {
      t.setAttribute("stroke", CREAM);
      t.setAttribute("stroke-width", 16);
      t.setAttribute("stroke-linejoin", "round");
      t.setAttribute("paint-order", "stroke fill");
    });
    // 副标只写话题，不写「05 ·」——序号会把每一集绑成连续剧
    if (seg.kicker) {
      // 标题折成两行时，副标要跟着往下走，否则会压在第二行上
      const k = txt(head, seg.kicker, 960, 400 + (q.length - 1) * 118 + 96, 44, INK, 700);
      k.setAttribute("stroke", CREAM);
      k.setAttribute("stroke-width", 12);
      k.setAttribute("stroke-linejoin", "round");
      k.setAttribute("paint-order", "stroke fill");
    }

    const dots = el("g", {}, host);
    const D = [];
    for (let i = 0; i < 14; i++) {
      const g = el("g", {}, dots);
      el("circle", { cx: 0, cy: 0, r: 5, fill: "#FFE98A" }, g);
      D.push({ g, x: rnd(i * 3.7) * W, y: 120 + rnd(i * 5.1) * 800, p: rnd(i * 2.9) * 6.28 });
    }
    return (tt, u) => {
      c.kaoG.setAttribute("transform", `translate(${c.kx} ${c.feet}) scale(${c.KS})`);
      const bounce = Math.sin(tt * 2.2) * 8;
      c.xiG.setAttribute("transform", `translate(${c.xx} ${c.feet + bounce}) scale(${c.XS})`);
      brand.setAttribute("opacity", easeOut(u / 0.12));
      head.setAttribute("transform", `translate(0 ${lerp(30, 0, easeOut(u / 0.16))})`);
      head.setAttribute("opacity", easeOut(u / 0.1));
      D.forEach(d => {
        d.g.setAttribute("transform", `translate(${d.x} ${d.y + Math.sin(tt * 1.4 + d.p) * 20})`);
        d.g.setAttribute("opacity", 0.4 + 0.6 * Math.abs(Math.sin(tt + d.p)));
      });
    };
  }
};

};

/* ---------- talk：角色对话（最常用） ---------- */
SCENES.talk = {
  mount(host, seg) {
    /* 景别：shot = "close" 把镜头推到脸上。
       中景用来讲道理，大脸用来给情绪——参考片最抓人的就是这种镜头。
       做法：同一套角色放大 3 倍、脚底推到画面外，只留头肩，眼睛落在画面中上部。 */
    const close = seg.shot === "close";
    const spkXi = seg.speaker === "xi";
    const EYE_Y = 470;
    // 两个角色在各自坐标系里的眼睛高度不一样：考考 -450，小熹 -160（头小、单位也小）。
    // 用错基准，脸就会掉到画面底下——只露出头顶。
    const EYE_LOCAL = spkXi ? 160 : 450;
    const sc = close ? (spkXi ? 6.6 : 3.0) : 0;
    const c = castChars(host, close ? {
      kaoX: spkXi ? -2600 : 960, xiX: spkXi ? 960 : 2600,
      feet: EYE_Y + EYE_LOCAL * sc,
      kaoScale: spkXi ? 0.92 : sc, xiScale: spkXi ? sc : 1.34,
      kaoExpr: seg.kaoExpr || "idle",
      xiView: seg.xiView || "front", xiExpr: seg.xiExpr || "idle", xiTail: seg.xiTail || "still",
    } : {
      kaoX: seg.kaoX || 520, xiX: seg.xiX || 1340, feet: seg.feet || 950,
      kaoScale: seg.kaoScale || 0.92, xiScale: seg.xiScale || 1.34,
      kaoExpr: seg.kaoExpr || "idle",
      xiView: seg.xiView || "front", xiExpr: seg.xiExpr || "idle", xiTail: seg.xiTail || "still",
    });
    const say = seg.say ? el("g", {}, host) : null;
    if (say) {
      /* 漫画式对白：气泡跟着说话的人走，不再横在画面中央。
         原来最大 1280 宽、固定居中，一句话能把整块背景盖掉；
         现在上限 780、靠说话者一侧，长句自动折两行。 */
      const isXi = seg.speaker === "xi";
      // 大脸特写时说话人一定在画面中间，气泡挂到头顶上方的空白区
      const spkX = close ? 960 : (isXi ? (seg.xiX || 1340) : (seg.kaoX || 520));
      const onLeft = spkX < 960;
      // 左右各留 70px 内边距。之前 20 字的气泡会把文字顶到描边上，看着像被框切了一刀
      // 西语按字符算宽度，中文按字数：拉丁字母窄，同一个 42 会让气泡宽出一倍
      const es = seg.lang === "es";
      const bw = clamp(seg.say.length * (es ? 22 : 42) + 180, 380, es ? 940 : 880);
      const fs = es ? 36 : 42;
      const maxChars = Math.max(6, Math.floor((bw - 140) / fs));
      const nLines = Math.max(1, Math.ceil(seg.say.length / maxChars));
      const lh = 54;
      const bh = 96 + nLines * lh;
      const bx = seg.sayX || (close ? 960 : (onLeft ? 452 : 1468));
      const by = seg.sayY || (close ? 180 : 286);

      // 投影
      el("rect", { x: -bw / 2 + 4, y: -bh / 2 + 7, width: bw, height: bh, rx: 34,
                   fill: INK, opacity: 0.20, style: "filter:blur(15px)" }, say);
      // 主体
      el("rect", { x: -bw / 2, y: -bh / 2, width: bw, height: bh, rx: 34,
                   fill: CREAM, stroke: INK, "stroke-width": 9 }, say);
      // 左上高光弧：一条细白线，气泡立刻从"色块"变成"有涂层的东西"
      el("path", { d: `M ${-bw / 2 + 30} ${-bh / 2 + 24} q ${bw * 0.34} -13 ${bw - 68} 2`,
                   fill: "none", stroke: "#FFFFFF", "stroke-width": 5,
                   "stroke-linecap": "round", opacity: 0.45 }, say);

      // 尾巴：曲线水滴，指向说话者脚下位置
      const tx = clamp(spkX - bx, -bw / 2 + 72, bw / 2 - 72);
      const ty = bh / 2 - 6;
      el("path", { d: `M ${tx - 32} ${ty} Q ${tx - 12} ${ty + 50} ${tx + 4} ${ty + 58} ` +
                      `Q ${tx + 10} ${ty + 28} ${tx + 32} ${ty}`,
                   fill: CREAM, stroke: INK, "stroke-width": 9, "stroke-linejoin": "round" }, say);
      el("rect", { x: tx - 34, y: ty - 16, width: 68, height: 20, fill: CREAM }, say);

      wrapTxt(say, seg.say, 0, -(nLines - 1) * lh / 2 + 15, fs, INK, 700, maxChars, lh, "middle");
      // 入场：从说话者那一侧弹进来，带一点方向感
      const dir = onLeft ? -1 : 1;
      say.setAttribute("transform",
        `translate(${bx + dir * 22} ${by + 16}) scale(${0.86})`);
      say.__intro = { bx, by, dir };
    }
    // 动嘴看「谁在配音」，压暗看「谁在说话」—— 旁白讲道理时两人都别动嘴
    const role = seg.voice || seg.speaker;
    return (tt, u) => {
      const active = seg.speaker;
      const kaoTalk = role === "kao";
      const xiTalk = role === "xi";
      /* 动作由四层叠出来，不再是单纯的上下浮动：
         呼吸（竖向微缩放）+ 重心摇摆（以脚底为轴的旋转）+ 说话前倾 + 倾听点头。
         两人相位错开，否则会像两个同一台机器驱动的假人。 */
      const kaoListening = !kaoTalk;
      const xiListening = !xiTalk;
      // 点头用 6 次方做脉冲：大部分时间不动，偶尔点一下
      const nodK = kaoListening ? Math.pow(Math.max(0, Math.sin(tt * 2.05 + 0.7)), 6) : 0;
      const nodX = xiListening ? Math.pow(Math.max(0, Math.sin(tt * 2.35 + 2.2)), 6) : 0;

      const kb = (kaoTalk ? Math.sin(tt * 8.5) * 3.2 : Math.sin(tt * 1.55) * 2.6) + nodK * 7;
      const xb = (xiTalk ? Math.sin(tt * 7.6) * 4.2 : Math.sin(tt * 1.85) * 3.0) + nodX * 8;

      const kSway = Math.sin(tt * 0.72 + 0.6) * 1.0 + (kaoTalk ? Math.sin(tt * 3.0) * 0.8 : 0) + nodK * 0.7;
      const xSway = Math.sin(tt * 0.88 + 2.1) * 1.7 + (xiTalk ? Math.sin(tt * 3.4) * 1.1 : 0) + nodX * 0.9;

      const kBreath = 1 + Math.sin(tt * 1.45) * 0.006 + (kaoTalk ? 0.010 : 0);
      const xBreath = 1 + Math.sin(tt * 1.75 + 0.4) * 0.008 + (xiTalk ? 0.014 : 0);

      c.kaoG.setAttribute("transform",
        `translate(${c.kx} ${c.feet + kb}) rotate(${kSway}) scale(${c.KS * kBreath})`);
      c.xiG.setAttribute("transform",
        `translate(${c.xx} ${c.feet + xb}) rotate(${xSway}) scale(${c.XS * xBreath})`);
      if (c.kao.__mouth && (seg.kaoExpr || "") === "talk") animMouth(c.kao.__mouth, -378, kaoTalk, tt, 13);
      if (c.xi.__mouth) animMouth(c.xi.__mouth, -125, xiTalk, tt, 15);
      if (c.kao.__eyes) blink(c.kao.__eyes, tt, 3);
      // 非说话方压暗一点点，把注意力留给说话的人
      c.kaoG.setAttribute("opacity", xiTalk ? 0.82 : 1);
      c.xiG.setAttribute("opacity", kaoTalk ? 0.82 : 1);
      if (say) {
        const k = clamp(u / 0.15, 0, 1);
        const e = easeBack(k);
        say.setAttribute("transform",
          `translate(${say.__intro.bx + say.__intro.dir * 24 * (1 - k)} ` +
          `${say.__intro.by + 18 * (1 - k)}) scale(${0.86 + 0.14 * e})`);
        say.setAttribute("opacity", clamp(u / 0.06, 0, 1));
      }
    };
  }
};

/* ---------- song：片尾儿歌（歌词板，逐句高亮） ----------
   每集把三个知识点压成 6–8 句押韵短句。孩子记不住道理，但记得住顺口溜。
   高亮按「字数比例」推进：TTS 的停顿不完全均匀，但比整段常亮好得多。 */
SCENES.song = {
  mount(host, seg) {
    const lines = (seg.song || []).slice(0, 8);
    const card = el("g", {}, host);
    el("rect", { x: 132, y: 168, width: 1656, height: 760, rx: 56,
                 fill: INK, opacity: 0.24, style: "filter:blur(24px)" }, card);
    el("rect", { x: 120, y: 156, width: 1656, height: 760, rx: 56, fill: CREAM,
                 stroke: INK, "stroke-width": 12 }, card);
    txt(card, seg.title || "记住这首歌", 948, 246, 54, "#B4551F", 700);
    el("path", { d: "M 420 292 H 1476", stroke: "#D3BE99", "stroke-width": 4 }, card);
    el("circle", { cx: 424, cy: 292, r: 6, fill: "#D3BE99" }, card);
    el("circle", { cx: 1472, cy: 292, r: 6, fill: "#D3BE99" }, card);

    const half = Math.ceil(lines.length / 2);
    // 列距跟着最长句走：固定 620/1300 时空隙近 250px，歌词像被撕成两半；
    // 按「最长高亮条 + 40px 呼吸」动态居中，既收紧又不会让长句两列重叠。
    const maxLen = lines.reduce((m, s) => Math.max(m, s.length), 1);
    const colGap = maxLen * 46 + 64 + 40;
    const leftX = 948 - colGap / 2, rightX = 948 + colGap / 2;
    const rows = [];
    // 先算总分再分段：边遍历边除会让每一段的终点都变成 1，第一句永远高亮
    const total = lines.reduce((a, s) => a + s.length, 0) || 1;
    let acc = 0;
    const cues = lines.map(s => {
      const st = acc / total;
      acc += s.length;
      return { st, en: acc / total };
    });
    lines.forEach((s, i) => {
      const col = i < half ? 0 : 1;
      const x = col === 0 ? leftX : rightX;
      const y = 400 + (i % half) * 128;
      const g = el("g", {}, host);
      // 高亮条跟着句子长度走：固定宽度会让短句看起来像被人用荧光笔乱涂了一道
      const w = s.length * 46 + 64;
      const hl = el("rect", { x: x - w / 2, y: y - 52, width: w, height: 84, rx: 24,
                              fill: "#FFD34D", opacity: 0 }, g);
      const t = txt(g, s, x, y, 46, INK, 700);
      rows.push({ g, hl, t, i });
    });

    return (tt, u) => {
      card.setAttribute("opacity", easeOut(u / 0.08));
      // 打拍子：整块卡片轻微起伏，像在跟着唱
      const beat = 1 + Math.sin(tt * 5.0) * 0.0035;
      card.setAttribute("transform", `translate(948 536) scale(${beat}) translate(-948 -536)`);
      rows.forEach((r, i) => {
        const k = clamp((u - 0.04 - i * 0.03) / 0.08, 0, 1);
        r.g.setAttribute("opacity", easeOut(k));
        r.g.setAttribute("transform", `translate(0 ${lerp(20, 0, easeOut(k))})`);
      });
      const ai = cues.findIndex(c => u >= c.st && u < c.en);
      rows.forEach((r, i) => r.hl.setAttribute("opacity", i === ai ? 0.8 : 0));
    };
  }
};

/* ---------- figure：按对象本身画（不套圆盘） ----------
   讲的具体是什么，就画成什么样：玻璃鳗是半透明的小长条，不是一片树叶。
   画法由每集 scenery.js 用 SCENE_KIT.figure("名字", fn) 提供。
   和 show 的分工：
     show   只留给抽象概念（光、波、循环）——那些本来就没有具体长相；
     figure 用来画具体东西（某种鱼、某个器官、某件器物）。
------------------------------------------------------------------------- */
const FIGURES = {};
SCENES.figure = {
  mount(host, seg) {
    const fn = FIGURES[seg.figure];
    if (!fn) {
      // 找不到就明说，别静默画个空画面
      const t = txt(host, "缺图：" + (seg.figure || "?"), 960, 540, 44, "#FFD34D", 700);
      t.setAttribute("stroke", INK); t.setAttribute("stroke-width", 10);
      t.setAttribute("paint-order", "stroke fill");
      return () => {};
    }
    const g = el("g", {}, host);
    const upd = fn(g, seg);
    return (tt, u) => {
      const k = clamp(u / 0.10, 0, 1);
      g.setAttribute("opacity", easeOut(k));
      g.setAttribute("transform", `translate(0 ${lerp(26, 0, easeOut(k))})`);
      if (upd) upd(tt, u);
    };
  }
};

/* ---------- show：大特写（聚光 + 符号 + 标注） ---------- */
/* show：讲知识的主画面。
   已废弃「大圆盘 + 一个图标」：那个圈和文案没有关系，只在装饰画面，看起来像瞎画。
   现在必须给 figure —— 这一段讲什么，画面里就画什么。给不出就明示缺图。 */
SCENES.show = {
  mount(host, seg) {
    const fn = FIGURES[seg.figure];
    if (!fn) {
      const t = txt(host, "缺图：" + (seg.figure || "未指定 figure"), 960, 456, 46, "#FFD34D", 700);
      t.setAttribute("stroke", INK); t.setAttribute("stroke-width", 10);
      t.setAttribute("paint-order", "stroke fill");
      const s = txt(host, "这一段讲什么，就要把那个东西画出来", 960, 546, 34, CREAM, 600);
      s.setAttribute("opacity", 0.85);
      s.setAttribute("stroke", INK); s.setAttribute("stroke-width", 8); s.setAttribute("paint-order", "stroke fill");
      return () => {};
    }
    const g = el("g", {}, host);
    const upd = fn(g, seg);
    // 标题放顶部横带，不压图案主体
    const title = seg.big ? wrapTxt(host, seg.big, 960, 128, 62, CREAM, 700, 18, 74) : [];
    title.forEach(t => {
      t.setAttribute("stroke", INK); t.setAttribute("stroke-width", 12);
      t.setAttribute("paint-order", "stroke fill");
    });
    return (tt, u) => {
      const k = clamp(u / 0.10, 0, 1);
      g.setAttribute("opacity", easeOut(k));
      g.setAttribute("transform", `translate(0 ${lerp(24, 0, easeOut(k))})`);
      if (upd) upd(tt, u);
      title.forEach(t => t.setAttribute("opacity", clamp((u - 0.06) / 0.1, 0, 1)));
    };
  }
};

/* ---------- photo：实拍图（缓慢推拉 + 统一调色 + 角标署名） ----------
   图片由 build.py 读成 base64 内联进来（file:// 下 <image href="本地路径"> 会被 Chrome 拦）。
   调色是为了让照片和卡通画面不那么割裂：降饱和、压一点对比、叠暖色。 */
SCENES.photo = {
  mount(host, seg) {
    if (!seg.photo) return () => {};
    const g = el("g", {}, host);
    // 图比画面大 8%，推近时不会露边
    const img = el("image", {
      href: seg.photo, x: -80, y: -45, width: W + 160, height: H + 90,
      preserveAspectRatio: "xMidYMid slice",
    }, g);
    // 统一到卡通的色感：暖色软光 + 轻微降饱和由 ffmpeg 负责，这里只加氛围
    el("rect", { width: W, height: H, fill: "#E8B96A", opacity: 0.10,
                 style: "mix-blend-mode:soft-light" }, g);
    el("rect", { width: W, height: H, fill: "url(#gVig)", opacity: 0.55 }, g);

    // 角标署名：CC BY / CC BY-SA 要求可见署名，右下角小条
    if (seg.credit) {
      /* 角标位置：默认右上角；creditPos:"br" 放右下角。
         右下角要压到字幕下方（基线 1006），所以落点放 1046，否则会和第二行字幕叠在一起。
         底下垫一条半透明胶囊：照片可能是亮草地，纯白字不加底会看不清。 */
      const br = seg.creditPos === "br";
      const cy = br ? H - 34 : 40;
      const cw = Math.min(W - 80, seg.credit.length * 15.5 + 40);
      el("rect", { x: W - 28 - cw, y: cy - 26, width: cw, height: 44, rx: 22,
                   fill: "#000000", opacity: 0.26 }, host);
      const t = txt(host, seg.credit, W - 46, cy, 26, "#FFFFFF", 600, "end");
      t.setAttribute("stroke", "#000000"); t.setAttribute("stroke-width", 7);
      t.setAttribute("paint-order", "stroke fill"); t.setAttribute("opacity", 0.95);
    }
    // 缓慢推近 + 轻微横移，静图也有呼吸
    const to = seg.kenBurns === "out" ? 1.0 : 1.08;
    const from = seg.kenBurns === "out" ? 1.12 : 1.0;
    return (tt, u) => {
      const k = lerp(from, to, easeOut(u));
      const px = 60 * Math.sin(u * Math.PI);
      g.setAttribute("transform",
        `translate(${960 + px} ${540}) scale(${k}) translate(-960 -540)`);
      img.setAttribute("opacity", clamp(u / 0.08, 0, 1));
    };
  }
};

const world = document.getElementById("world");
const subEls = [document.getElementById("sub0"), document.getElementById("sub1")];
const postGrade = document.getElementById("postGrade");
const postVig = document.getElementById("postVig");
let SEGS = [], TOTAL = 0;

window.setTimeline = function (tl) {
  SEGS = (tl.segments || []).slice();
  TOTAL = SEGS.reduce((a, s) => a + s.dur, 0);
  let t0 = 0;
  world.innerHTML = "";
  SEGS.forEach((seg, i) => {
    seg.start = t0; t0 += seg.dur;
    const host = el("g", { class: "scene", opacity: 0 }, world);
    const bgRoot = el("g", { "data-crisp-tree": "1" }, host);   // 背景整棵保留矢量：渐变 + 图案太大，手绘档会糊
    const bgFn = BG[seg.bg] || BG.meadow_day;
    const bgUpdate = bgFn(bgRoot, seg);
    const content = el("g", {}, host);
    ROUGHING = ROUGH;
    SEED = ROUGH_SEED + i * 37;
    const sc = (SCENES[seg.type] || SCENES.talk).mount(content, seg);
    ROUGHING = false;
    seg.__host = host;
    seg.__update = sc;
    seg.__bgUpdate = bgUpdate;
    seg.__prof = (BG[seg.bg] || BG.meadow_day).prof || { grade: 0.04, vig: 0.12 };
  });
  // 氛围层：全片建一份，浓度跟着当前段的背景走
  const atmo = document.getElementById("atmo");
  atmo.innerHTML = "";
  ATMO.bokeh = [];
  ATMO.dust = [];
  // 先铺主光与薄雾（在光斑/浮尘之下）

                           fill: "url(#gHaze)", opacity: 0 }, atmo);
  for (let i = 0; i < 5; i++) {
    const r = 54 + rnd(i * 3.3) * 86;
    const c = el("circle", { cx: 0, cy: 0, r, fill: "url(#gBokeh)", opacity: 0 }, atmo);
    ATMO.bokeh.push({
      n: c, x: rnd(i * 5.7) * W, y: 80 + rnd(i * 7.1) * 900,

// 叠化时长。不能长：两个整屏背景各出一半透明度会「双曝光」，画面发灰。
// 0.16s ≈ 5 帧，足够消掉硬切的顿挫，又不至于看清两张画面叠在一起。
const FADE = 0.16;

function activeIndex(t) {
  for (let i = 0; i < SEGS.length; i++) {
    const s = SEGS[i];
    if (t >= s.start - FADE && t <= s.start + s.dur + FADE) return i;
  }
  return t < 0 ? 0 : SEGS.length - 1;
}

window.renderFrame = function (t) {
  const ai = activeIndex(t);
  let grade = 0, vig = 0;
  for (let i = 0; i < SEGS.length; i++) {
    const s = SEGS[i];
    // 「盖上去」而不是「两边一起半透明」：后一场在完全透明的前一场上面渐显。
    // 两边同时降到 50% 会让画面往底色塌，中间那几帧发灰（双曝光）。
    const vis = t >= s.start - 0.001 && t < s.start + s.dur + FADE;
    const o = vis ? (i === 0 ? 1 : clamp((t - s.start) / FADE, 0, 1)) : 0;
    s.__host.setAttribute("opacity", vis ? o : 0);
    s.__host.setAttribute("display", vis ? "inline" : "none");
    if (vis) {
      const tt = clamp(t - s.start, -0.5, s.dur + 0.5);
      const u = clamp((t - s.start) / s.dur, 0, 1);
      // 镜头：慢推到目标构图 + 两个不同频率的正弦漂移，避免看出规律
      const cam = CAMERA[s.type] || CAMERA.talk;
      const cs = lerp(cam.from, cam.to, easeOutExpo(u));
      const dx = Math.sin(tt * 0.33 + i * 2.3) * cam.drift;
      const dy = Math.cos(tt * 0.27 + i * 1.7) * cam.drift * 0.55;
      s.__host.setAttribute("transform",
        `translate(${960 + dx} ${540 + dy}) scale(${cs}) translate(-960 -540)`);
      s.__update(tt, u);
      if (s.__bgUpdate) s.__bgUpdate(t);
      if (o > (grade || 0)) { grade = s.__prof.grade * o; vig = s.__prof.vig * o; }
    }
  }
  postGrade.setAttribute("opacity", grade);
  postVig.setAttribute("opacity", vig);

  // 氛围层：光斑缓慢横漂 + 浮尘向上循环，浓度按当前背景
  const curSeg = SEGS[ai];
  const bgName = curSeg ? curSeg.bg : "meadow_day";
  const aop = ATMO_OP[bgName] != null ? ATMO_OP[bgName] : 0.12;
  // 主光轻微呼吸，别死板地一直亮着
  const kop = (KEY_OP[bgName] != null ? KEY_OP[bgName] : 0.5) * (0.92 + 0.08 * Math.sin(t * 0.7));
  ATMO.key.setAttribute("opacity", kop);
  // 光晕位置必须和背景里的光源对齐（太阳/月亮/天窗各在不同角落），否则一眼假
  if (ATMO.bg !== bgName) {
    ATMO.bg = bgName;
    const LP = (BG[bgName] && BG[bgName].light) || { x: 210, y: 40 };
    ATMO.key.setAttribute("cx", LP.x);
    ATMO.key.setAttribute("cy", LP.y);
  }
  ATMO.haze.setAttribute("opacity", HAZE_OP[bgName] || 0);
  const WX = W + 420, HY = H + 320;
  ATMO.bokeh.forEach(b => {
    const x = ((b.x + b.vx * t + Math.sin(t * 0.11 + b.ph) * 55) % WX + WX) % WX - 210;
    const y = ((b.y + b.vy * t) % HY + HY) % HY - 160;
    b.n.setAttribute("cx", x);
    b.n.setAttribute("cy", y);
    b.n.setAttribute("opacity", aop * (0.5 + 0.5 * Math.abs(Math.sin(t * 0.5 + b.ph))));
  });
  ATMO.dust.forEach(d => {
    const y = ((d.y0 - t * d.sp) % HY + HY) % HY - 100;
    d.n.setAttribute("cx", d.x + Math.sin(t * 0.6 + d.ph) * d.sway);
    d.n.setAttribute("cy", y);
    d.n.setAttribute("opacity", aop * 1.15 * (0.3 + 0.7 * Math.abs(Math.sin(t * 0.8 + d.ph))));
  });

  // 字幕：build.py 已按句子切好（subs: [{t, lines}]），这里只挑当前一条
  // 硬规则：告别卡/题目/歌词板/片头这类文字已经整块画在画面上，绝不再走底部字幕框。
  // 放在渲染层兜底，这样即使台本误填了 text→sub，也不会出现「下次见」又说又打字幕。
  const NO_SUB = { outro: 1, quiz: 1, song: 1, title: 1 };
  const s = SEGS[ai];
  let active = null, k = 0;
  if (s && !NO_SUB[s.type] && s.subs && s.subs.length) {
    const lt = t - s.start;
    for (const e of s.subs) if (lt >= e.t) active = e;
    if (active) {
      k = clamp((lt - active.t) / 0.12, 0, 1) * clamp((s.start + s.dur - 0.12 - t) / 0.3, 0, 1);
      active.lines.slice(0, 2).forEach((ln, i) => { subEls[i].textContent = ln; });
      if (active.lines.length === 1) subEls[1].textContent = "";
    }
  }
  subEls.forEach(e => e.setAttribute("opacity", k));
};

/* ==================================================================
   每集自带场景代码的接口
   --------------------------------------------------------------
   不走「背景库 + 话题映射」。每一集按自己的话题和每段文案，
   在 epXX/scenery.js 里现场用代码画场景，注册到 BG 上：

     SCENE_KIT.scene("太空", (root, seg) => {
       SCENE_KIT.rect(root, ...);      // 天空
       SCENE_KIT.planet(root, 1500, 300);
       return (t) => { ... };           // 可选：每帧更新
     });

   然后台本里这段写 "bg": "太空"。
   引擎在 setTimeline 时按名字找 BG[seg.bg]，找不到才退回兜底背景。
   ================================================================== */
/* 拟人化五官：给任意图形按上眼睛和嘴，物体立刻「活」起来。
   参考片里瓶子、冰块、蚊子都有表情——这是最便宜也最有效的「生动」来源。 */
function faceKit(parent, x, y, r, expr) {
  const g = el("g", { transform: `translate(${x} ${y})` }, parent);
  const er = r * 0.4, dy = -r * 0.16;
  const eye = (dx) => {
    const e = el("g", {}, g);
    if (expr === "shock") {
      el("circle", { cx: dx, cy: dy, r: er * 1.08, fill: "#FFFFFF", stroke: INK, "stroke-width": r * 0.05 }, e);
      el("circle", { cx: dx, cy: dy + r * 0.02, r: er * 0.38, fill: INK }, e);
      return;
    }
    el("circle", { cx: dx, cy: dy, r: er, fill: "#FFFFFF", stroke: INK, "stroke-width": r * 0.05 }, e);
    el("circle", { cx: dx + r * 0.05, cy: dy + r * 0.03, r: er * 0.52, fill: INK }, e);
    el("circle", { cx: dx + r * 0.14, cy: dy - r * 0.07, r: er * 0.17, fill: "#FFFFFF" }, e);
  };
  eye(-r * 0.44); eye(r * 0.44);
  if (expr === "shock") {
    el("ellipse", { cx: 0, cy: r * 0.44, rx: r * 0.18, ry: r * 0.24,
                    fill: "#7A2B2B", stroke: INK, "stroke-width": r * 0.05 }, g);
  } else if (expr === "smile") {
    el("path", { d: `M ${-r * 0.3} ${r * 0.3} q ${r * 0.3} ${r * 0.3} ${r * 0.6} 0`,
                 fill: "none", stroke: INK, "stroke-width": r * 0.07, "stroke-linecap": "round" }, g);
  } else {
    el("ellipse", { cx: 0, cy: r * 0.38, rx: r * 0.1, ry: r * 0.12, fill: "#7A2B2B" }, g);
  }
  return g;
}

/* ---------- 精细绘制：渐变 / 裁剪 ----------
   拼基本图形（椭圆当身体、矩形当腿）永远画不细。要精细就得：
   轮廓用路径、体积用渐变、局部用裁剪、细节另起一层。
   下面三个函数是这套画法的最小工具集。
------------------------------------------------------------------------- */
function _defs() {
  let d = document.getElementById("dyn-defs");
  if (!d) {
    d = document.createElementNS(NS, "defs");
    d.setAttribute("id", "dyn-defs");
    document.getElementById("stage").prepend(d);
  }
  return d;
}
function grad(id, stops, o) {
  const opt = o || {};
  if (document.getElementById(id)) return `url(#${id})`;
  const g = document.createElementNS(NS, "linearGradient");
  g.setAttribute("id", id);
  g.setAttribute("x1", opt.x1 != null ? opt.x1 : 0);
  g.setAttribute("y1", opt.y1 != null ? opt.y1 : 0);
  g.setAttribute("x2", opt.x2 != null ? opt.x2 : 0);
  g.setAttribute("y2", opt.y2 != null ? opt.y2 : 1);
  (stops || []).forEach(([off, col, op]) => {
    const st = document.createElementNS(NS, "stop");
    st.setAttribute("offset", off);
    st.setAttribute("stop-color", col);
    if (op != null) st.setAttribute("stop-opacity", op);
    g.appendChild(st);
  });
  _defs().appendChild(g);
  return `url(#${id})`;
}
function rgrad(id, stops, o) {
  const opt = o || {};
  if (document.getElementById(id)) return `url(#${id})`;
  const g = document.createElementNS(NS, "radialGradient");
  g.setAttribute("id", id);
  g.setAttribute("cx", opt.cx != null ? opt.cx : 0.5);
  g.setAttribute("cy", opt.cy != null ? opt.cy : 0.4);
  g.setAttribute("r", opt.r != null ? opt.r : 0.7);
  (stops || []).forEach(([off, col, op]) => {
    const st = document.createElementNS(NS, "stop");
    st.setAttribute("offset", off);
    st.setAttribute("stop-color", col);
    if (op != null) st.setAttribute("stop-opacity", op);
    g.appendChild(st);
  });
  _defs().appendChild(g);
  return `url(#${id})`;
}
/** 把一组图形裁进一个路径里：条纹、毛流必须贴合身体轮廓时用 */
function clipTo(id, d) {
  let cp = document.getElementById(id);
  if (!cp) {
    cp = document.createElementNS(NS, "clipPath");
    cp.setAttribute("id", id);
    _defs().appendChild(cp);
  }
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", d);
  cp.appendChild(p);
  return `url(#${id})`;
}

window.SCENE_KIT = {
  BG,
  scene(name, fn) { BG[name] = fn; return fn; },   // 注册一段场景（背景）
  figure(name, fn) { FIGURES[name] = fn; return fn; },  // 注册一个具体对象（前景绘制）
  el, txt, wrapTxt, rnd, nearSil, clamp, lerp, faceKit,
  grad, rgrad, clipTo,
  W, H, INK, CREAM, NS,
  // 常用渐变 id，直接写 fill: "url(#gSkyDay)" 即可
  G: {
    skyDay: "url(#gSkyDay)", skyNight: "url(#gSkyNight)", under: "url(#gUnder)",
    forest: "url(#gForest)", skyHigh: "url(#gSkyHigh)", room: "url(#gRoom)",
    storm: "url(#gStorm)", micro: "url(#gMicro)", gold: "url(#gGold)", sun: "url(#gSun)",
  },
};
</script>
